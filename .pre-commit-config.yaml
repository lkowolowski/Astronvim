# .pre-commit-config.yaml
# https://pre-commit.com
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  # ── Standard file hygiene ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]  # allows YAML anchors
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=100]
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── yamllint — YAML style and syntax ─────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]
        files: '\.(yml|yaml)$'

  # ── markdownlint — Markdown style ────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yml]

  # ── StyLua — Lua formatter ───────────────────────────────────────────────
  - repo: https://github.com/JohnnyMorganz/stylua
    rev: v2.5.2
    hooks:
      - id: stylua-system
        args: [--check, --config-path, .stylua.toml]

  # ── selene — Lua linter ──────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: selene
        name: selene
        entry: selene
        args: [--config, selene.toml]
        language: system
        types: [lua]

  # ── Taplo — TOML formatter ───────────────────────────────────────────────
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args: [--check]

  # ── editorconfig-checker — enforce .editorconfig ─────────────────────────
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.10.0
    hooks:
      - id: editorconfig-checker

  # ── codespell — spelling of code and prose ───────────────────────────────
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [-L, ans]
